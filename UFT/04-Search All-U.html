<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover" />
    <title>کوئی بھی نام تلاش کریں </title>
    
    <style>
        .header-stats-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 10px;
            color: var(--gold);
            font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
            white-space: nowrap;
            flex-shrink: 0;
        }

        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Inter:wght@400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --maroon: #5a0000;
            --dark-blue: #0f172a;
            --gold: #d4af37;
            --light-gold: #f1d279;
            --green: #2e7d32;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
            background: #1a1a1a;
            margin: 0;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            height: 100vh;
            height: 100dvh;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            border: 2px solid var(--gold);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
            width: 100%;
        }

        /* ===== HEADER ===== */
        .app-header {
            background: linear-gradient(135deg, var(--dark-blue) 0%, #1e3d3d 100%);
            color: var(--gold);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold);
            flex-shrink: 0;
            min-height: 60px;
            position: relative;
        }

        .header-title {
            font-family: 'Playfair Display', 'Noto Nastaliq Urdu', serif;
            font-size: 20px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: static;
            transform: none;
            flex: 1;
            text-align: center;
            white-space: nowrap;
            visibility: visible !important;
            opacity: 1 !important;
        }

        .header-icon {
            font-size: 24px;
        }

        .home-btn {
            background: var(--gold);
            color: var(--dark-blue);
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
            border: 2px solid white;
            transition: all 0.3s;
            flex-shrink: 0;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 10;
        }
        .home-btn:hover { background: var(--light-gold); transform: scale(1.05); }
        .home-btn span { font-size: 14px; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fffcf8;
            padding: 12px 15px 15px 15px;
            min-height: 0;
        }

        .search-section {
            padding: 15px;
            background: #fffcf8;
            width: 85%;
            margin: 0 auto;
            flex-shrink: 0;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: nowrap;
        }

        .search-label {
            font-weight: 700;
            color: var(--maroon);
            font-size: 13px;
            white-space: nowrap;
            font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 0;
            z-index: 1000;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif !important;
            text-align: right;
            background: white;
        }

        .search-input:focus {
            border-color: var(--gold);
        }

        .search-input::placeholder {
            font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid var(--gold);
            border-radius: 0 0 4px 4px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 9999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .search-dropdown.show {
            display: block !important;
        }

        .result-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
            text-align: right;
            font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
            background: white;
        }

        .result-item:hover {
            background: #faebcd;
        }

        .result-item .main-line {
            font-weight: 700;
            color: var(--dark-blue);
            font-size: 13px;
        }

        .result-item .sub-line {
            font-size: 11px;
            color: #555;
            margin-top: 3px;
        }

        .no-match {
            padding: 12px 15px;
            color: #7a6a58;
            text-align: center;
            font-size: 13px;
        }

        .reset-btn {
            padding: 10px 20px;
            background: var(--gold);
            color: var(--dark-blue);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
            white-space: nowrap;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .reset-btn:hover {
            background: var(--light-gold);
            transform: scale(1.02);
        }

        .search-results-inline {
            font-size: 11px;
            color: var(--maroon);
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 2px solid var(--gold);
            background: white;
            flex: 1;
            min-height: 150px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 700px;
        }

        th {
            background: #faf6f0;
            color: #5a0000;
            font-weight: 700;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #666;
            font-size: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 8px 8px;
            border: 1px solid #666;
            vertical-align: middle;
            background-color: white;
            font-size: 12px;
            text-align: right;
        }
        tr:hover td { background-color: #faebcd; cursor: pointer; }
        tr.female-row td { background-color: #fff0f0; }

        .clickable-name {
            cursor: pointer;
            transition: all 0.2s;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .clickable-name:hover {
            background: #faebcd;
            transform: scale(1.02);
        }
        .clickable-name.female:hover {
            background: #f8d0d8;
        }

        .details-icon {
            cursor: pointer;
            font-size: 14px;
            color: var(--gold);
            display: inline-block;
            transition: all 0.2s;
        }
        .details-icon:hover {
            transform: scale(1.2);
            color: var(--light-gold);
        }

        .no-results {
            padding: 40px 16px;
            text-align: center;
            color: #7a6a58;
            font-size: 14px;
        }
        .no-results span { font-size: 40px; display: block; margin-bottom: 12px; }

        .app-footer {
            background: var(--dark-blue);
            color: var(--gold);
            text-align: center;
            padding: 6px;
            font-size: 10px;
            border-top: 2px solid var(--gold);
            flex-shrink: 0;
        }

        .details-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fffcf8;
            border-radius: 16px;
            padding: 30px;
            z-index: 6001;
            max-width: 600px;
            width: 92%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 3px solid var(--gold);
            direction: rtl;
            text-align: right;
            display: none;
        }
        .details-modal .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold);
            padding-bottom: 14px;
            margin-bottom: 18px;
        }
        .details-modal .details-header h2 {
            font-family: 'Noto Nastaliq Urdu', 'Playfair Display', serif;
            color: var(--dark-blue);
            font-size: 20px;
            margin: 0;
            line-height: 1.3;
        }
        .details-modal .details-content-box {
            background: #faf6f0;
            padding: 18px;
            border-radius: 8px;
            border-right: 4px solid var(--gold);
            border-left: none;
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.8;
            font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
            color: #1a1a1a;
            max-height: 400px;
            overflow-y: auto;
        }
        .details-modal .details-actions {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 2px solid var(--gold);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .details-modal .details-actions .close-btn {
            padding: 10px 24px;
            background: var(--gold);
            color: var(--dark-blue);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .details-modal .details-actions .close-btn:hover {
            background: var(--light-gold);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 5999;
            display: none;
        }

        @media screen and (max-width: 768px) {
            body {
                padding: 0 !important;
                background: white !important;
                height: 100% !important;
                height: 100dvh !important;
            }
            
            .container {
                border-radius: 0 !important;
                border: none !important;
                height: 100% !important;
                height: 100dvh !important;
                max-height: none !important;
                width: 100% !important;
                box-shadow: none !important;
            }

            .main-content {
                zoom: 0.50;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <a href="01-Dashboard-U.html" class="home-btn"><span>🏠</span> ہوم</a>

        <div class="header-title">
            <span class="header-icon">🌿</span>
            <span>کوئی بھی نام تلاش کریں</span>
        </div>

        <div class="header-stats-left">
            <span id="headerStatsBottom">⚡ 608 اراکین</span>
        </div>
    </div>
    
    <div class="main-content" id="mainContent">
        <div class="search-section">
            <div class="search-row">
                <span class="search-label">نام تلاش کریں</span>
                <div class="search-wrapper">
                    <input type="text" id="searchInput" class="search-input" placeholder="نام درج کریں..." autocomplete="off">
                    <div id="searchDropdown" class="search-dropdown"></div>
                </div>
                <div class="reset-btn" onclick="resetSearch()">🔄 دوبارہ ترتیب</div>
                <span class="search-results-inline">نتائج: <span id="resultCount">0</span></span>
            </div>
        </div>

        <div id="resultArea" style="flex:1; display:flex; flex-direction:column; min-height:0;">
            <div class="table-wrapper">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th style="width:5%;">نمبر</th>
                            <th style="width:25%;">نام</th>
                            <th style="width:20%;">والد</th>
                            <th style="width:15%;">والدہ</th>
                            <th style="width:15%;">شریک حیات</th>
                            <th style="width:10%;">نسل</th>
                            <th style="width:10%;">تفصیلات</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="7" class="no-results"><span>📂</span> ڈیٹا لوڈ ہو رہا ہے...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="app-footer">
        ڈویلپر: عمران حیدر ص/ سید رسالت حسین رضوی | 0332-787-6010
    </div>
</div>

<div class="modal-overlay" id="detailsOverlay" onclick="closeDetailsModal()"></div>
<div class="details-modal" id="detailsModal">
    <div class="details-header">
        <h2 id="detailsModalTitle">📝 تفصیلات</h2>
    </div>
    <div class="details-body">
        <div class="details-content-box" id="detailsModalContent">
            تفصیلات لوڈ ہو رہی ہیں...
        </div>
    </div>
    <div class="details-actions">
        <button class="close-btn" onclick="closeDetailsModal()">✕ بند کریں</button>
    </div>
</div>

<script src="33-family-data-urdu.js"></script>

<script>
function displayName(str) { 
    if (!str) return '';
    let cleaned = str.replace(/[\s-۔]*\d+$/, '').trim();
    return cleaned;
}

function openDetailsModal(personName) {
    const person = window.familyDataList.find(p => p.name === personName);
    if (!person) return;
    
    let detailsText = person.details && person.details.trim() !== '' 
        ? person.details 
        : 'کوئی تفصیلات دستیاب نہیں';
    
    document.getElementById('detailsModalTitle').textContent = '📝 تفصیلات — ' + displayName(personName);
    document.getElementById('detailsModalContent').innerHTML = detailsText.replace(/\\n/g, '<br>');
    document.getElementById('detailsModal').style.display = 'block';
    document.getElementById('detailsOverlay').style.display = 'block';
    document.body.style.overflow = 'hidden';
}

function closeDetailsModal() {
    document.getElementById('detailsModal').style.display = 'none';
    document.getElementById('detailsOverlay').style.display = 'none';
    document.body.style.overflow = 'auto';
}

function resetSearch() {
    const searchInput = document.getElementById('searchInput');
    const tableBody = document.getElementById('tableBody');
    const resultCountSpan = document.getElementById('resultCount');
    const dropdownList = document.getElementById('searchDropdown');

    searchInput.value = '';
    tableBody.innerHTML =
        `<tr><td colspan="7" class="no-results"><span>🔎</span> تمام فیلڈز میں تلاش کرنے کے لیے نام ٹائپ کریں</td></tr>`;
    document.getElementById('headerStatsBottom').textContent = `⚡ ${window.totalMembersCount || 0} اراکین`;
    resultCountSpan.textContent = '0';
    dropdownList.classList.remove('show');
    searchInput.focus();
}

(function() {
    const searchInput = document.getElementById('searchInput');
    const tableBody = document.getElementById('tableBody');
    const resultCountSpan = document.getElementById('resultCount');
    const dropdownList = document.getElementById('searchDropdown');

    let familyData = [];

    if (typeof FAMILY_DATA_URDU !== 'undefined' && Array.isArray(FAMILY_DATA_URDU) && FAMILY_DATA_URDU.length > 0) {
        familyData = FAMILY_DATA_URDU;
        window.familyDataList = familyData;
    } else {
        tableBody.innerHTML = `<tr><td colspan="7" class="no-results"><span>⚠️</span> ڈیٹا فائل موجود نہیں</td></tr>`;
        return;
    }

    const totalMembers = familyData.length;
    window.totalMembersCount = totalMembers;
    document.getElementById('headerStatsBottom').textContent = `⚡ ${totalMembers} اراکین`;

    function escapeAttr(str) {
        if (!str) return '';
        return String(str).replace(/["']/g, '&quot;');
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }

    function buildDropdown(query) {
        if (!query || query.trim() === '') {
            dropdownList.classList.remove('show');
            dropdownList.innerHTML = '';
            return;
        }
        const q = query.trim().toLowerCase();
        
        const matchedMap = new Map();
        
        for (const m of familyData) {
            const fields = [
                { key: 'نام', value: m.name || '' },
                { key: 'والد', value: m.father || '' },
                { key: 'والدہ', value: m.mother || '' },
                { key: 'شریک حیات', value: m.spouse || '' },
                { key: 'نسل', value: m.gen || '' },
                { key: 'تفصیلات', value: m.details || '' }
            ];
            
            let foundField = false;
            for (const f of fields) {
                if (f.value.toLowerCase().includes(q)) {
                    foundField = true;
                    break;
                }
            }
            
            if (foundField) {
                if (!matchedMap.has(m.name)) {
                    matchedMap.set(m.name, m);
                }
            }
        }

        const uniqueMatches = Array.from(matchedMap.values()).slice(0, 15);

        if (uniqueMatches.length === 0) {
            dropdownList.innerHTML = `<div class="no-match">کوئی مماثل نام یا رشتہ نہیں ملا</div>`;
            dropdownList.classList.add('show');
            return;
        }

        let html = '';
        for (const m of uniqueMatches) {
            const isFemale = m.gender && m.gender.toUpperCase() === 'FEMALE';
            
            let parentLabel = isFemale ? 'والدہ' : 'والد';
            let parentVal = isFemale ? (m.mother || m.father || '—') : (m.father || '—');
            
            let namePart = escHtml(displayName(m.name) || '—');
            let genPart = m.gen ? ` (${escHtml(m.gen)})` : '';
            let mainLineText = `${namePart}${genPart}`;

            let subLineText = `${parentLabel} ${escHtml(displayName(parentVal))}`;

            html += `
                <div class="result-item" data-name="${escapeAttr(m.name)}">
                    <div class="main-line">${mainLineText}</div>
                    <div class="sub-line">${subLineText}</div>
                </div>
            `;
        }
        dropdownList.innerHTML = html;
        dropdownList.classList.add('show');
        
        dropdownList.querySelectorAll('.result-item').forEach(item => {
            item.addEventListener('mousedown', function(e) {
                e.preventDefault();
            });
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                const name = this.dataset.name;
                if (name) {
                    searchInput.value = displayName(name);
                    dropdownList.classList.remove('show');
                    performSearch();
                }
            });
        });
    }

    function searchInAllFields(query) {
        if (!query || query.trim() === '') return [];
        const q = query.trim().toLowerCase();
        const resultsMap = new Map();

        for (const member of familyData) {
            let matchField = null;
            const fields = [
                { key: 'نام', value: member.name || '' },
                { key: 'والد', value: member.father || '' },
                { key: 'والدہ', value: member.mother || '' },
                { key: 'شریک حیات', value: member.spouse || '' },
                { key: 'نسل', value: member.gen || '' },
                { key: 'تفصیلات', value: member.details || '' }
            ];
            for (const f of fields) {
                if (f.value.toLowerCase().includes(q)) {
                    matchField = f.key;
                    break;
                }
            }
            if (matchField && !resultsMap.has(member.name)) {
                resultsMap.set(member.name, { ...member, _matchField: matchField });
            }
        }
        return Array.from(resultsMap.values());
    }

    function renderResults(results, query) {
        if (!results || results.length === 0) {
            tableBody.innerHTML =
                `<tr><td colspan="7" class="no-results"><span>🔎</span> کوئی نتیجہ نہیں ملا</td></tr>`;
            document.getElementById('headerStatsBottom').textContent = `⚡ ${totalMembers} اراکین`;
            resultCountSpan.textContent = '0';
            return;
        }
        let html = '';
        let rowNum = 1;
        for (const m of results) {
            const isFemale = m.gender && m.gender.toUpperCase() === 'FEMALE';
            const rowClass = isFemale ? 'female-row' : '';
            const nameClean = displayName(m.name);
            const fatherClean = displayName(m.father);
            
            html += `<tr class="${rowClass}">`;
            html += `<td style="text-align:center;">${rowNum}</td>`;
            html += `<td><span class="clickable-name" onclick="openDetailsModal('${escapeAttr(m.name)}')">${escHtml(nameClean)}</span></td>`;
            html += `<td>${escHtml(fatherClean)}</td>`;
            html += `<td>${escHtml(m.mother || '—')}</td>`;
            html += `<td>${escHtml(m.spouse || '—')}</td>`;
            html += `<td style="text-align:center;">${escHtml(m.gen || '—')}</td>`;
            
            if (m.details && m.details.trim() !== '') {
                html += `<td style="text-align:center;"><span class="details-icon" onclick="openDetailsModal('${escapeAttr(m.name)}')">ℹ️</span></td>`;
            } else {
                html += `<td style="text-align:center; color:#ccc;">—</td>`;
            }
            html += `</tr>`;
            rowNum++;
        }
        tableBody.innerHTML = html;
        document.getElementById('headerStatsBottom').textContent = `⚡ ${totalMembers} اراکین`;
        resultCountSpan.textContent = results.length;
    }

    function performSearch() {
        const query = searchInput.value;
        if (!query || query.trim() === '') {
            tableBody.innerHTML =
                `<tr><td colspan="7" class="no-results"><span>🔎</span> تمام فیلڈز میں تلاش کرنے کے لیے نام الفاظ ٹائپ کریں</td></tr>`;
            document.getElementById('headerStatsBottom').textContent = `⚡ ${totalMembers} اراکین`;
            resultCountSpan.textContent = '0';
            dropdownList.classList.remove('show');
            return;
        }
        const results = searchInAllFields(query);
        renderResults(results, query);
        dropdownList.classList.remove('show');
    }

    searchInput.addEventListener('input', function(e) {
        const val = this.value;
        buildDropdown(val);
        if (!val || val.trim() === '') {
            dropdownList.classList.remove('show');
        }
    });

    document.addEventListener('click', function(e) {
        const wrapper = document.querySelector('.search-wrapper');
        if (wrapper && !wrapper.contains(e.target)) {
            dropdownList.classList.remove('show');
        }
        if (e.target === document.getElementById('detailsOverlay')) {
            closeDetailsModal();
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeDetailsModal();
            dropdownList.classList.remove('show');
        }
    });

    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            performSearch();
            dropdownList.classList.remove('show');
        }
        if (e.key === 'Escape') {
            resetSearch();
            dropdownList.classList.remove('show');
        }
    });

    resetSearch();
})();
</script>

</body>
</html>
